<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabata Motors - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        h1 { font-size: 24px; color: var(--text); }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group.full { grid-column: span 2; }
        label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; background-color: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
        button { background-color: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-danger { background-color: var(--danger); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--text-secondary); font-weight: 600; }
        .status-msg { margin-top: 10px; font-size: 14px; font-weight: 500; }
        .car-thumb { width: 50px; height: 35px; object-fit: cover; border-radius: 4px; margin-right: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Kabata Motors Admin</h1>
            <span id="connection-status" style="color: var(--text-secondary);">Connecting to Firebase...</span>
        </header>

        <!-- Add Car Form -->
        <div class="card">
            <h3 style="margin-bottom: 15px;">Add New Car Listing</h3>
            <form id="car-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Car Make</label>
                        <select id="car-make" required>
                            <option value="">Select Make</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Nissan">Nissan</option>
                            <option value="Subaru">Subaru</option>
                            <option value="Mazda">Mazda</option>
                            <option value="Honda">Honda</option>
                            <option value="Mercedes-Benz">Mercedes-Benz</option>
                            <option value="BMW">BMW</option>
                            <option value="Volkswagen">Volkswagen</option>
                            <option value="Mitsubishi">Mitsubishi</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Model & Details</label>
                        <input type="text" id="car-model" placeholder="e.g. Crown / Axela / Impreza">
                    </div>
                    <div class="form-group">
                        <label>Price (KES)</label>
                        <input type="number" id="car-price" required placeholder="1,500,000">
                    </div>
                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" id="car-year" placeholder="2018">
                    </div>
                    <div class="form-group">
                        <label>Transmission</label>
                        <select id="car-transmission">
                            <option value="">Select Transmission</option>
                            <option value="Automatic">Automatic</option>
                            <option value="Manual">Manual</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <select id="car-location">
                            <option value="">Select Location</option>
                            <option value="Nairobi">Nairobi</option>
                            <option value="Mombasa">Mombasa</option>
                            <option value="Nakuru">Nakuru</option>
                            <option value="Eldoret">Eldoret</option>
                            <option value="Kisumu">Kisumu</option>
                            <option value="Thika">Thika</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label>Car Images (Select multiple)</label>
                        <input type="file" id="car-images" accept="image/*" multiple required>
                    </div>
                </div>
                <button type="submit" id="submit-btn">Publish Listing</button>
                <div id="form-status" class="status-msg"></div>
            </form>
        </div>

        <!-- Inventory List -->
        <div class="card">
            <h3 style="margin-bottom: 15px;">Current Inventory</h3>
            <table>
                <thead>
                    <tr>
                        <th>Images</th>
                        <th>Car</th>
                        <th>Location</th>
                        <th>Price</th>
                        <th>Year</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="inventory-table">
                    <tr><td colspan="6" style="text-align: center; color: var(--text-secondary);">Loading inventory...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBxdXaRmelsJjHkY9VvFl63p3ID_Daq0SE",
            authDomain: "kabata-motors.firebaseapp.com",
            projectId: "kabata-motors",
            storageBucket: "kabata-motors.firebasestorage.app",
            messagingSenderId: "836867497965",
            appId: "1:836867497965:web:592205194b4382d643d1e4",
            measurementId: "G-VRPVCV0XQV"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('connection-status').innerText = "Connected to Firebase ✅";
        document.getElementById('connection-status').style.color = "var(--success)";

        const carForm = document.getElementById('car-form');
        const submitBtn = document.getElementById('submit-btn');
        const formStatus = document.getElementById('form-status');

        // Function to resize image and compress to JPEG so it fits well under the 1MB limit
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        // Max dimensions constraint to keep file sizes low
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 600;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height = Math.round((height * MAX_WIDTH) / width);
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width = Math.round((width * MAX_HEIGHT) / height);
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Compress to JPEG format with 0.7 quality
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        resolve(compressedDataUrl);
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        carForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "Compressing Images...";
            formStatus.innerText = "";

            const make = document.getElementById('car-make').value;
            const model = document.getElementById('car-model').value;
            const title = model ? `${make} ${model}` : make;
            const price = document.getElementById('car-price').value;
            const year = document.getElementById('car-year').value;
            const transmission = document.getElementById('car-transmission').value;
            const location = document.getElementById('car-location').value;
            const imageFiles = document.getElementById('car-images').files;

            try {
                let imageUrls = [];
                for (let i = 0; i < imageFiles.length; i++) {
                    const compressedBase64 = await compressImage(imageFiles[i]);
                    imageUrls.push(compressedBase64);
                }

                submitBtn.innerText = "Saving to Database...";
                await db.collection('cars').add({
                    make,
                    model: model || '',
                    title,
                    price: Number(price),
                    year: year ? Number(year) : '',
                    transmission: transmission || 'N/A',
                    location: location || 'N/A',
                    imageUrls,
                    imageUrl: imageUrls[0],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                formStatus.style.color = "var(--success)";
                formStatus.innerText = "Car successfully listed and saved!";
                carForm.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                formStatus.style.color = "var(--danger)";
                formStatus.innerText = "Error: " + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Publish Listing";
            }
        });

        function loadInventory() {
            const tableBody = document.getElementById('inventory-table');
            
            db.collection('cars').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-secondary);">No cars listed yet.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = "";
                snapshot.forEach((doc) => {
                    const car = doc.data();
                    let imagesHtml = '';
                    
                    const imgs = car.imageUrls || [car.imageUrl];
                    imgs.slice(0, 3).forEach(img => {
                        if(img) imagesHtml += `<img src="${img}" class="car-thumb" alt="Car">`;
                    });

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${imagesHtml}</td>
                        <td><strong>${car.title}</strong><br><small style="color:var(--text-secondary);">${car.transmission || ''}</small></td>
                        <td>${car.location || 'N/A'}</td>
                        <td>KES ${Number(car.price).toLocaleString()}</td>
                        <td>${car.year || 'N/A'}</td>
                        <td><button class="btn-danger" onclick="deleteCar('${doc.id}')" style="padding: 5px 10px; font-size: 12px;">Delete</button></td>
                    `;
                    tableBody.appendChild(tr);
                });
            }, (error) => {
                console.error("Error loading inventory:", error);
            });
        }

        window.deleteCar = async function(id) {
            if (confirm("Are you sure you want to delete this listing?")) {
                try {
                    await db.collection('cars').doc(id).delete();
                } catch (error) {
                    alert("Error deleting record: " + error.message);
                }
            }
        }

        loadInventory();
    </script>
</body>
</html>
