<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kabata Motors - Locally used Car Marketplace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="nav-container" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
      <h1 style="font-size: 1.25rem;">KABATA MOTORS</h1>
      <button id="signInBtn" style="background: #000; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">Sign In</button>
    </div>
  </header>

  <!-- Hero / Search Section -->
  <section class="hero">
    <h2>Find Your Dream Ride in Kenya</h2>
    <p>Browse verified local cars with 100% free listings.</p>
  </section>

  <div class="search-filter">
    <!-- Search & Filter Controls -->
    <div class="filters-grid" style="display: flex; gap: 10px; flex-wrap: wrap;">
      <input type="text" id="searchInput" placeholder="Search model, make..." style="padding: 8px; flex: 1; border: 1px solid #ccc; border-radius: 4px;">
    </div>
  </div>

  <!-- Main Car Inventory Grid -->
  <main class="container">
    <div id="carListings" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;">
      <!-- Car cards will be injected here via app.js -->
    </div>
  </main>

  <!-- Interactive Sign In Modal -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <h2>Sign In to Kabata Motors</h2>
      <form id="loginForm">
        <input type="email" placeholder="Email Address" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="cars-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
