<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KABATA MOTORS | Kenya Auto Marketplace</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">KABATA<span>MOTORS</span> 🚗</h1>
            <div class="nav-actions">
                <span id="userDisplay" class="hidden"></span>
                <button id="authBtn" class="btn-secondary">Sign In / Register</button>
                <button id="toggleFormBtn" class="btn-primary hidden">+ Post Car Free</button>
            </div>
        </div>
    </nav>

    <!-- Auth Modal (Handles Sign In, Register, & Password Reset) -->
    <div id="authModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeAuthModal" class="close">&times;</span>
            <h2 id="authTitle">Sign In to KABATA MOTORS</h2>
            <form id="authForm">
                <input type="text" id="authName" placeholder="Full Name / Dealership" class="hidden">
                <input type="email" id="authEmail" placeholder="Email Address" required>
                <input type="password" id="authPassword" placeholder="Password" required>
                
                <!-- Forgot Password placed right under the password input -->
                <a href="#" id="forgotPasswordLink" style="font-size: 12px; color: #007bff; text-decoration: none; margin-top: -6px; margin-bottom: 4px; text-align: right; display: block;">Forgot password?</a>

                <button type="submit" id="authSubmitBtn" class="btn-primary">Sign In</button>
            </form>
            <p class="auth-switch" style="margin-top: 15px; text-align: center; font-size: 13px;">
                <span id="switchText">Don't have an account?</span> 
                <a href="#" id="toggleAuthMode">Register here</a>
            </p>
        </div>
    </div>

    <!-- Hero Header Section -->
    <header class="hero">
        <div class="hero-content">
            <h2>Find Your Dream Ride in Kenya</h2>
            <p>Browse verified local & foreign used cars with 100% free listings.</p>
        </div>
    </header>

    <main class="container">
        <!-- Post Car Form Modal (Hidden by default) -->
        <section id="postCarSection" class="post-box hidden">
            <h2>List Your Vehicle for Free</h2>
            <form id="postCarForm">
                <input type="text" id="postMake" placeholder="Make (e.g. Toyota, Mazda)" required>
                <input type="text" id="postModel" placeholder="Model (e.g. RAV4, Demio)" required>
                <input type="number" id="postPrice" placeholder="Price in KSh (e.g. 1500000)" required>
                <input type="number" id="postYear" placeholder="Year (e.g. 2018)" required>
                
                <input type="text" id="postSellerName" placeholder="Seller / Dealership Name" required>
                <input type="tel" id="postSellerPhone" placeholder="Phone Number (e.g. 0712345678)" required>

                <select id="postLocation" required>
                    <option value="">Select Town / Location</option>
                    <option value="Nairobi">Nairobi</option>
                    <option value="Mombasa">Mombasa</option>
                    <option value="Nakuru">Nakuru</option>
                    <option value="Eldoret">Eldoret</option>
                    <option value="Kisumu">Kisumu</option>
                    <option value="Thika">Thika</option>
                    <option value="Kiambu">Kiambu</option>
                    <option value="Machakos">Machakos</option>
                    <option value="Nyeri">Nyeri</option>
                    <option value="Meru">Meru</option>
                    <option value="Kisii">Kisii</option>
                    <option value="Kitale">Kitale</option>
                    <option value="Malindi">Malindi</option>
                </select>

                <select id="postCondition" required>
                    <option value="Foreign Used">Foreign Used</option>
                    <option value="Locally Used">Locally Used</option>
                </select>

                <select id="postTransmission" required>
                    <option value="">Transmission</option>
                    <option value="Automatic">Automatic</option>
                    <option value="Manual">Manual</option>
                </select>

                <select id="postFuel" required>
                    <option value="">Fuel Type</option>
                    <option value="Petrol">Petrol</option>
                    <option value="Diesel">Diesel</option>
                    <option value="Hybrid">Hybrid</option>
                </select>

                <input type="number" id="postCc" placeholder="Engine CC (e.g. 1500)" required>
                
                <label for="postImageFile" class="file-label">Upload Car Photo from Device:</label>
                <input type="file" id="postImageFile" accept="image/*">

                <button type="submit" class="btn-success">Publish Listing Now</button>
            </form>
        </section>

        <!-- Search & Filter Bar -->
        <section class="filter-box">
            <h3>Search & Filter Inventory</h3>
            <div class="filter-grid">
                <select id="makeFilter">
                    <option value="">All Makes</option>
                    <option value="Toyota">Toyota</option>
                    <option value="Mazda">Mazda</option>
                    <option value="Subaru">Subaru</option>
                    <option value="Nissan">Nissan</option>
                </select>

                <input type="text" id="modelFilter" placeholder="Search model...">

                <select id="priceFilter">
                    <option value="">Max Price (KSh)</option>
                    <option value="1000000">Under 1M</option>
                    <option value="2000000">Under 2M</option>
                    <option value="3500000">Under 3.5M</option>
                    <option value="5000000">Under 5M</option>
                </select>

                <select id="yearFilter">
                    <option value="">Min Year</option>
                    <option value="2012">2012+</option>
                    <option value="2015">2015+</option>
                    <option value="2018">2018+</option>
                    <option value="2020">2020+</option>
                </select>

                <select id="locationFilter">
                    <option value="">All Towns in Kenya</option>
                    <option value="Nairobi">Nairobi</option>
                    <option value="Mombasa">Mombasa</option>
                    <option value="Nakuru">Nakuru</option>
                    <option value="Eldoret">Eldoret</option>
                    <option value="Kisumu">Kisumu</option>
                    <option value="Thika">Thika</option>
                    <option value="Kiambu">Kiambu</option>
                    <option value="Machakos">Machakos</option>
                    <option value="Nyeri">Nyeri</option>
                    <option value="Meru">Meru</option>
                    <option value="Kisii">Kisii</option>
                    <option value="Kitale">Kitale</option>
                    <option value="Malindi">Malindi</option>
                </select>

                <select id="transmissionFilter">
                    <option value="">Transmission</option>
                    <option value="Automatic">Automatic</option>
                    <option value="Manual">Manual</option>
                </select>

                <select id="fuelFilter">
                    <option value="">Fuel Type</option>
                    <option value="Petrol">Petrol</option>
                    <option value="Diesel">Diesel</option>
                    <option value="Hybrid">Hybrid</option>
                </select>

                <select id="ccFilter">
                    <option value="">Engine CC</option>
                    <option value="1500">Under 1500cc</option>
                    <option value="2000">Under 2000cc</option>
                    <option value="2500">2000cc+</option>
                </select>
            </div>
        </section>

        <!-- Car Listings Grid -->
        <section class="listings-section">
            <h3 class="section-title">Fresh Listings in Kenya</h3>
            <div id="carGrid" class="car-grid">
                <!-- Dynamic cards loaded here -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
