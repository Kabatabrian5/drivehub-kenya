<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabata Motors - Quality Cars for Sale</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }
        
        header { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 700; color: var(--text); }
        .logo span { color: var(--accent); }
        .admin-link { color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; transition: 0.2s; }
        .admin-link:hover { background-color: var(--border); color: var(--text); }

        .hero { text-align: center; padding: 40px 20px; }
        .hero h1 { font-size: 32px; margin-bottom: 10px; }
        .hero p { color: var(--text-secondary); font-size: 16px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        .car-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        
        .car-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        .car-img-container { position: relative; height: 200px; background-color: #000; }
        .car-img { width: 100%; height: 100%; object-fit: cover; }
        .car-price-tag { position: absolute; bottom: 10px; left: 10px; background-color: rgba(15, 23, 42, 0.85); color: var(--accent); padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 16px; border: 1px solid var(--border); }
        
        .car-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .car-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .car-details { display: flex; gap: 10px; font-size: 13px; color: var(--text-secondary); margin-bottom: 15px; }
        .car-details span { background-color: var(--bg); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); }
        
        .more-info-box { background-color: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 13px; color: var(--text-secondary); margin-bottom: 15px; max-height: 80px; overflow-y: auto; }
        
        .whatsapp-btn { background-color: #22c55e; color: white; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; display: block; transition: opacity 0.2s; }
        .whatsapp-btn:hover { opacity: 0.9; }

        .empty-state { text-align: center; color: var(--text-secondary); grid-column: 1 / -1; padding: 40px; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Kabata <span>Motors</span></div>
        <a href="admin.html" class="admin-link">Admin Portal ⚙️</a>
    </header>

    <div class="hero">
        <h1>Find Your Dream Car</h1>
        <p>Browse our verified inventory of quality vehicles available on sale.</p>
    </div>

    <div class="container">
        <div id="car-grid" class="car-grid">
            <div class="empty-state">Loading inventory...</div>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBxdXaRmelsJjHkY9VvFl63p3ID_Daq0SE",
            authDomain: "kabata-motors.firebaseapp.com",
            projectId: "kabata-motors",
            storageBucket: "kabata-motors.firebasestorage.app",
            messagingSenderId: "836867497965",
            appId: "1:836867497965:web:592205194b4382d643d1e4",
            measurementId: "G-VRPVCV0XQV"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const grid = document.getElementById('car-grid');

        db.collection('cars').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
            if (snapshot.empty) {
                grid.innerHTML = `<div class="empty-state">No cars currently listed in inventory. Check back soon!</div>`;
                return;
            }

            grid.innerHTML = "";
            snapshot.forEach((doc) => {
                const car = doc.data();
                const displayImg = car.imageUrl || (car.imageUrls && car.imageUrls[0]) || '';
                
                const card = document.createElement('div');
                card.className = 'car-card';
                card.innerHTML = `
                    <div class="car-img-container">
                        <img src="${displayImg}" class="car-img" alt="${car.title}">
                        <div class="car-price-tag">KES ${Number(car.price).toLocaleString()}</div>
                    </div>
                    <div class="car-body">
                        <div>
                            <div class="car-title">${car.title}</div>
                            <div class="car-details">
                                <span>📅 ${car.year || 'N/A'}</span>
                                <span>📍 ${car.location || 'N/A'}</span>
                                <span>⚙️ ${car.transmission || 'N/A'}</span>
                            </div>
                            <div class="more-info-box">
                                <strong>More Information:</strong><br>
                                ${car.moreInfo || 'No extra notes provided.'}
                            </div>
                        </div>
                        <a href="https://wa.me/?text=Hello,%20I%20am%20interested%20in%20the%20${encodeURIComponent(car.title)}%20listed%20at%20KES%20${car.price}" target="_blank" class="whatsapp-btn">💬 Inquire via WhatsApp</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }, (error) => {
            console.error("Error loading cars:", error);
            grid.innerHTML = `<div class="empty-state">Error loading inventory. Please check your connection.</div>`;
        });
    </script>
</body>
</html>
